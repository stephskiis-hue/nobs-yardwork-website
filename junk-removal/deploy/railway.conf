# Apache config for the container deploy. Not used by the cPanel host.

ServerName localhost

<Directory /var/www/html>
    # Debian defaults this to None, which makes Apache ignore .htaccess
    # entirely — extensionless URLs and the custom 404 would both stop working.
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# ---------------------------------------------------------------------------
# STAGING IS NOT PUBLIC-FACING.
#
# A Railway URL is on the open internet. Without this, Google can index a
# staging copy carrying placeholder prices, and later compete with the real
# no-bs-junkremoval.com for the same terms — a duplicate-content problem that
# is tedious to unwind once it happens.
#
# `always` matters: without it the header is skipped on non-2xx responses,
# so the 404 page would still be indexable.
#
# This lives here rather than in .htaccess so that it CANNOT follow the site
# to production. The cPanel deploy never sees this file.
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</IfModule>

# ---------------------------------------------------------------------------
# PREVIEW BANNER
#
# The staging URL is meant to be shared, so anyone opening it should be able to
# tell at a glance that the prices are placeholders and the business is not
# live. Injected after </header> rather than written into the pages, so the
# committed HTML has no staging cruft in it.
#
# Deliberately quote-free markup: Apache directive arguments are quoted with
# double quotes, and HTML5 permits unquoted attribute values, so this avoids
# an escaping mess. The # delimiter avoids clashing with URLs.
# ---------------------------------------------------------------------------
# SetOutputFilter on .html rather than AddOutputFilterByType text/html:
# AddOutputFilterByType does not reliably attach to an ErrorDocument, because
# that is served through an internal redirect whose filter chain is built
# before the type is resolved. The 404 page was silently skipping both this
# banner and the host rewrite below. Scoping to .html also keeps the filter
# off CSS, JS and images, which it has no business touching.
<IfModule mod_substitute.c>
    <Directory /var/www/html>
        <FilesMatch "\.html$">
            SetOutputFilter SUBSTITUTE
            Substitute "s#</header>#</header><div class=jr-staging><strong>PREVIEW SITE</strong> &mdash; No BS Junk Removal is not live yet. Prices shown are placeholders and photo slots are marked where the real photos are still to come.</div>#n"
        </FilesMatch>
    </Directory>
</IfModule>

# Keep build tooling and docs out of the container's web root.
<FilesMatch "^(_build\.py|entrypoint\.sh|Dockerfile|README\.md|MIGRATE\.md)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(_pages|deploy)">
    Require all denied
</DirectoryMatch>
