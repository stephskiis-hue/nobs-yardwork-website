# Apache config for the container deploy. Not used by the cPanel host.

ServerName localhost

<Directory /var/www/html>
    # Debian defaults this to None, which makes Apache ignore .htaccess
    # entirely — extensionless URLs and the custom 404 would both stop working.
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# ---------------------------------------------------------------------------
# STAGING IS NOT PUBLIC-FACING.
#
# A Railway URL is on the open internet. Without this, Google can index a
# staging copy carrying placeholder prices, and later compete with the real
# no-bs-junkremoval.com for the same terms — a duplicate-content problem that
# is tedious to unwind once it happens.
#
# `always` matters: without it the header is skipped on non-2xx responses,
# so the 404 page would still be indexable.
#
# This lives here rather than in .htaccess so that it CANNOT follow the site
# to production. The cPanel deploy never sees this file.
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</IfModule>

# Keep build tooling and docs out of the container's web root.
<FilesMatch "^(_build\.py|entrypoint\.sh|Dockerfile|README\.md|MIGRATE\.md)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(_pages|deploy)">
    Require all denied
</DirectoryMatch>
