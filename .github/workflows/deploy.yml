# ============================================================================
# Deploy to FTP — DISABLED ON PURPOSE. READ THIS BEFORE ENABLING.
# ============================================================================
#
# This workflow only becomes active once this directory is the root of its own
# repository. While it lives inside nobs-yardwork-website it is ignored, because
# GitHub only reads workflows from .github/workflows/ at the repo root.
#
# WHY IT IS DISABLED
# ------------------
# The parent site's workflow runs:
#     lftp mirror --reverse --delete ./ /public_html/
# `--delete` removes anything on the server that is not in the repo. Pointed at
# the wrong directory, this workflow would delete the entire live
# no-bs-yardwork.com site. So it ships with three safety catches:
#
#   1. no `on: push` trigger — it can only be run by hand
#   2. FTP_TARGET is a placeholder, not a real path
#   3. `--dry-run` is on, so lftp reports what it would do and changes nothing
#
# TO ENABLE (after the addon domain exists and you have checked its docroot):
#   1. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD to this repo's
#      Settings -> Secrets and variables -> Actions.
#   2. Set FTP_TARGET below to the addon domain's ACTUAL document root. In
#      cPanel: Domains -> your domain -> Document Root. Get this wrong and you
#      will overwrite whatever is at the path you typed.
#   3. Run the workflow manually once with --dry-run still on. Read the output.
#      Confirm the paths are what you expect.
#   4. Remove `--dry-run`, run it manually again, and check the live site.
#   5. Only then uncomment the `push:` trigger below.
# ============================================================================

name: Deploy to FTP (disabled)

on:
  workflow_dispatch:
  # Uncomment ONLY after steps 1-4 above are done and verified.
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ---- CHANGE THIS to the addon domain's real document root. ----
      FTP_TARGET: /public_html/CHANGE-ME-TO-YOUR-DOCROOT/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse to run with the placeholder target
        run: |
          if [[ "$FTP_TARGET" == *"CHANGE-ME"* ]]; then
            echo "FTP_TARGET is still the placeholder. Set it to the addon"
            echo "domain's document root before running this workflow."
            exit 1
          fi
          if [[ "$FTP_TARGET" == "/public_html/" ]]; then
            echo "FTP_TARGET is the yardwork site's document root."
            echo "Deploying there would delete no-bs-yardwork.com. Refusing."
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > /tmp/lftp_script.txt <<SCRIPT
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set net:max-retries 3
          set net:reconnect-interval-base 5
          open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER}
          mirror --reverse --delete --dry-run --verbose \
            --exclude .git/ \
            --exclude .github/ \
            --exclude _pages/ \
            --exclude _build.py \
            --exclude images/_make-icons.py \
            --exclude README.md \
            --exclude MIGRATE.md \
            --exclude .gitignore \
            ./ ${FTP_TARGET}
          bye
          SCRIPT
          lftp -f /tmp/lftp_script.txt
