name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > /tmp/lftp_script.txt <<SCRIPT
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set net:max-retries 3
          set net:reconnect-interval-base 5
          debug 3
          open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER}
          mirror --reverse --verbose --exclude .git/ --exclude .github/ --exclude node_modules/ --exclude .gitignore --exclude README.md --exclude CLAUDE.md --exclude blog/ ./ /public_html/
          bye
          SCRIPT
          lftp -f /tmp/lftp_script.txt
